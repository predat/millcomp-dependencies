name: dependencies

# A tag vX.Y.Z (VERSION's) publishes the archives as a release. Everything else builds and keeps them as artifacts.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    # GitHub's limit is 360. The cache saved below lets a rerun go on with what was built.
    timeout-minutes: 350
    env:
      WORK: ${{ matrix.platform == 'windows' && 'D:/w' || 'build/work' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tools
        run: python -m pip install cmake==4.3.2 ninja==1.13.0 meson==1.12.1

      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y g++-14 libgl-dev libegl-dev libx11-dev libxkbcommon-dev libxcb-cursor0 nasm
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # FFmpeg's configure and make run in MSYS2's shell (the runner has MSYS2); nasm assembles dav1d's, SVT-AV1's and
      # FFmpeg's x86 code.
      - name: Windows tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make pkgconf diffutils
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # vcvars64.bat's environment, for the steps after: what it adds or changes.
      - name: MSVC environment
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ tools" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) { "$($matches[1])=$($matches[2])" }
          } | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # v2: build.py records what each project installs since; caches without the records start again.
      - name: Restore what was built
        uses: actions/cache/restore@v6
        with:
          path: build/install
          key: deps-v2-${{ matrix.platform }}-${{ hashFiles('build.py', 'lock.json', 'projects/**') }}-${{ github.run_id }}
          restore-keys: deps-v2-${{ matrix.platform }}-

      - name: Build and pack
        run: python build.py --work-dir ${{ env.WORK }} --package

      - name: Save what was built
        if: always()
        uses: actions/cache/save@v6
        with:
          path: build/install
          key: deps-v2-${{ matrix.platform }}-${{ hashFiles('build.py', 'lock.json', 'projects/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive complete and relocatable
        shell: bash
        run: python smoke/smoke.py "$(ls build/package/millcompDependencies-* | grep -v sha256)"

      - uses: actions/upload-artifact@v7
        with:
          name: millcompDependencies-${{ matrix.platform }}
          path: build/package/*
          retention-days: 14
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "millComp's dependencies, $GITHUB_REF_NAME" millcompDependencies-*
